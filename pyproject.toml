[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "teleop-qc"
version = "0.1.0"
description = "Quality control for robot teleoperation data: temporal alignment checks and calibrated VLM judges, on DROID streamed from the Hugging Face Hub."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jonathan Petit" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "av>=12",
  "pillow>=10",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
judges = ["anthropic>=0.40"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "scikit-learn>=1.4", "ruff>=0.6"]

[project.scripts]
teleop-qc = "teleop_qc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teleop_qc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: reads DROID from the Hugging Face Hub"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "PYI"]
